name: Docker Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/zenfracloud/runner-tf

jobs:
  build-and-push:
    name: Build and Push
    runs-on: arc-runner
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # ARC pods on K8s ship docker via a DinD sidecar on tcp://localhost:2375.
      # The sidecar races runner startup and docker/setup-qemu calls
      # `docker version` immediately, so poll for the daemon first.
      - name: Wait for DinD to be ready
        run: |
          for i in $(seq 1 60); do
            docker version >/dev/null 2>&1 && echo "DinD ready after ${i}s" && exit 0
            sleep 1
          done
          echo "DinD not ready after 60s" >&2
          docker version || true
          exit 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          # Mirrored: the shared runner IP hits Docker Hub's anonymous pull-rate limit.
          image: mirror.gcr.io/tonistiigi/binfmt:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      # PRs validate the Dockerfile on amd64 only and never push — arm64 under
      # QEMU roughly triples build time on shared runners for no extra signal
      # about the Dockerfile itself. Both arches are built when it lands.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: aws
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Display image size
        if: github.event_name != 'pull_request'
        run: |
          docker pull ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          docker images ${{ fromJSON(steps.meta.outputs.json).tags[0] }} \
            --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"
